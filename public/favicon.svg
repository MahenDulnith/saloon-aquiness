<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="80%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Circular Base with Transparent Background (No White Corners) -->
  <circle cx="64" cy="64" r="60" fill="#09090b" stroke="url(#gold)" stroke-width="4.5"/>
  <circle cx="64" cy="64" r="53" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.8"/>

  <!-- 5 Gold Stars at Top (Matching Aquiness Official Logo) -->
  <polygon points="64,18 66,23 71,23 67,26 69,31 64,28 59,31 61,26 57,23 62,23" fill="url(#gold)"/>
  <polygon points="46,23 48,27 52,27 49,29 50,33 46,31 42,33 43,29 40,27 44,27" fill="url(#gold)" opacity="0.85"/>
  <polygon points="82,23 84,27 88,27 85,29 86,33 82,31 78,33 79,29 76,27 80,27" fill="url(#gold)" opacity="0.85"/>
  <polygon points="32,32 33,35 37,35 34,37 35,40 32,38 29,40 30,37 27,35 31,35" fill="url(#gold)" opacity="0.7"/>
  <polygon points="96,32 97,35 101,35 98,37 99,40 96,38 93,40 94,37 91,35 95,35" fill="url(#gold)" opacity="0.7"/>

  <!-- Stylized Barber Pole & Artisan Scissors Crest -->
  <!-- Scissor Blades crossing through center -->
  <path d="M42 45 L86 89" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  <path d="M86 45 L42 89" stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Scissor Finger Loops at bottom -->
  <circle cx="40" cy="92" r="9" fill="none" stroke="url(#gold)" stroke-width="3.5"/>
  <circle cx="88" cy="92" r="9" fill="none" stroke="url(#gold)" stroke-width="3.5"/>

  <!-- Center Monogram 'A' (Aquiness Barber) -->
  <text x="64" y="75" 
        font-family="'Playfair Display', Georgia, serif" 
        font-size="34" 
        font-weight="900" 
        text-anchor="middle" 
        fill="url(#gold)">A</text>

  <!-- Barber Pole Top Knob & Details -->
  <circle cx="64" cy="40" r="4.5" fill="#ffffff" stroke="url(#gold)" stroke-width="2"/>
  
  <!-- Bottom Foundation Arc -->
  <path d="M48 108 Q64 114 80 108" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round"/>
</svg>
